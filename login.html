<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Quiz Platform</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-logo">📚</div>
      <h1>Quiz Platform</h1>
      <p class="auth-subtitle">AI 기반 실시간 퀴즈 학습 플랫폼</p>

      <!-- 탭 -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="teacher">선생님</button>
        <button class="auth-tab" data-tab="student">학생</button>
      </div>

      <!-- 선생님 로그인 -->
      <div id="teacher-tab" class="tab-content active">
        <form id="teacher-login-form" class="auth-form">
          <div class="form-group">
            <label for="teacher-username" class="form-label">아이디</label>
            <input 
              type="text" 
              id="teacher-username" 
              class="form-input" 
              placeholder="아이디를 입력하세요"
              required
              pattern="[a-z0-9_-]{5,20}"
            />
            <p class="form-help">5~20자의 영문 소문자, 숫자, -, _ 만 사용 가능</p>
          </div>

          <div class="form-group">
            <label for="teacher-password" class="form-label">비밀번호</label>
            <input 
              type="password" 
              id="teacher-password" 
              class="form-input" 
              placeholder="비밀번호를 입력하세요"
              required
              minlength="8"
              maxlength="16"
            />
            <p class="form-help">8~16자 영문 대/소문자, 숫자, 특수문자</p>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            로그인
          </button>

          <div class="auth-links">
            <a href="#" id="signup-link">회원가입</a>
          </div>
        </form>
      </div>

      <!-- 학생 로그인 -->
      <div id="student-tab" class="tab-content">
        <form id="student-login-form" class="auth-form">
          <div class="form-group">
            <label for="student-name-select" class="form-label">이름 선택</label>
            <select 
              id="student-name-select" 
              class="form-select"
              required
            >
              <option value="">이름을 선택하세요</option>
            </select>
            <p class="form-help">자신의 이름을 선택하세요</p>
          </div>

          <div class="form-group">
            <label for="student-password" class="form-label">비밀번호</label>
            <input 
              type="password" 
              id="student-password" 
              class="form-input" 
              placeholder="선생님이 알려준 비밀번호"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            로그인
          </button>

          <div class="auth-note">
            💡 선생님께 이름과 비밀번호를 확인하세요
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 회원가입 모달 -->
  <div id="signup-modal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2>선생님 회원가입</h2>
        <button class="modal-close" data-modal="signup-modal">&times;</button>
      </div>
      <form id="signup-form" class="modal-body">
        <div class="form-group">
          <label for="signup-name" class="form-label">이름 *</label>
          <input 
            type="text" 
            id="signup-name" 
            class="form-input" 
            placeholder="홍길동"
            required
          />
        </div>

        <div class="form-group">
          <label for="signup-username" class="form-label">아이디 *</label>
          <input 
            type="text" 
            id="signup-username" 
            class="form-input" 
            placeholder="아이디를 입력하세요"
            required
            pattern="[a-z0-9_-]{5,20}"
          />
          <p class="form-help">5~20자의 영문 소문자, 숫자, -, _ 만 사용 가능</p>
        </div>

        <div class="form-group">
          <label for="signup-password" class="form-label">비밀번호 *</label>
          <input 
            type="password" 
            id="signup-password" 
            class="form-input" 
            placeholder="비밀번호를 입력하세요"
            required
            minlength="8"
            maxlength="16"
          />
          <p class="form-help">8~16자 영문 대/소문자, 숫자, 특수문자 사용</p>
          <p class="form-help">사용 가능한 특수문자: ! " # $ % & ' ( ) * + , - . / : ; ? @ [ \ ] ^ _ ` { | } ~</p>
        </div>

        <div class="form-group">
          <label for="signup-password-confirm" class="form-label">비밀번호 확인 *</label>
          <input 
            type="password" 
            id="signup-password-confirm" 
            class="form-input" 
            placeholder="비밀번호를 다시 입력하세요"
            required
            minlength="8"
            maxlength="16"
          />
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal="signup-modal">
          취소
        </button>
        <button type="submit" form="signup-form" class="btn btn-primary">
          가입하기
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  
  <script>
    // 페이지 로드 시 학생 목록 불러오기
    document.addEventListener('DOMContentLoaded', async () => {
      await loadStudentNames();
    });

    // 학생 이름 목록 로드
    async function loadStudentNames() {
      try {
        const { data: students, error } = await supabase
          .from('users')
          .select('id, name, student_number')
          .eq('role', 'student')
          .order('name');

        if (error) throw error;

        const select = document.getElementById('student-name-select');
        select.innerHTML = '<option value="">이름을 선택하세요</option>';

        students.forEach(student => {
          const option = document.createElement('option');
          option.value = student.id;
          option.textContent = student.student_number 
            ? `${student.student_number}. ${student.name}` 
            : student.name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Student names loading error:', error);
      }
    }

    // 탭 전환
    document.querySelectorAll('.auth-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        
        document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        btn.classList.add('active');
        document.getElementById(`${tab}-tab`).classList.add('active');

        // 학생 탭으로 전환 시 이름 목록 새로고침
        if (tab === 'student') {
          loadStudentNames();
        }
      });
    });

    // 선생님 로그인
    document.getElementById('teacher-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('teacher-username').value.trim();
      const password = document.getElementById('teacher-password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      // 유효성 검사
      if (!validateUsername(username)) {
        Utils.showToast('아이디는 5~20자의 영문 소문자, 숫자, -, _ 만 사용 가능합니다.', 'error');
        return;
      }

      if (!validatePassword(password)) {
        Utils.showToast('비밀번호는 8~16자 영문 대/소문자, 숫자, 특수문자를 사용해야 합니다.', 'error');
        return;
      }
      
      try {
        Utils.toggleLoading(submitBtn, true);
        
        await Auth.signInWithUsername(username, password, 'teacher');
        
        window.location.href = '/teacher/dashboard.html';
      } catch (error) {
        console.error('Login error:', error);
      } finally {
        Utils.toggleLoading(submitBtn, false);
      }
    });

    // 학생 로그인
    document.getElementById('student-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const studentId = document.getElementById('student-name-select').value;
      const password = document.getElementById('student-password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      if (!studentId) {
        Utils.showToast('이름을 선택해주세요.', 'warning');
        return;
      }
      
      try {
        Utils.toggleLoading(submitBtn, true);
        
        await Auth.signInStudent(studentId, password);
        
        window.location.href = '/student/dashboard.html';
      } catch (error) {
        console.error('Login error:', error);
      } finally {
        Utils.toggleLoading(submitBtn, false);
      }
    });

    // 회원가입 모달
    document.getElementById('signup-link').addEventListener('click', (e) => {
      e.preventDefault();
      Utils.modal.show('signup-modal');
    });

    // 회원가입
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('signup-name').value.trim();
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value;
      const passwordConfirm = document.getElementById('signup-password-confirm').value;
      
      // 유효성 검사
      if (!validateUsername(username)) {
        Utils.showToast('아이디는 5~20자의 영문 소문자, 숫자, -, _ 만 사용 가능합니다.', 'error');
        return;
      }

      if (!validatePassword(password)) {
        Utils.showToast('비밀번호는 8~16자 영문 대/소문자, 숫자, 특수문자를 사용해야 합니다.', 'error');
        return;
      }

      if (password !== passwordConfirm) {
        Utils.showToast('비밀번호가 일치하지 않습니다.', 'error');
        return;
      }
      
      const submitBtn = document.querySelector('#signup-modal .btn-primary');
      
      try {
        Utils.toggleLoading(submitBtn, true);
        
        await Auth.signUpWithUsername(username, password, name);
        
        Utils.modal.hide('signup-modal');
        Utils.showToast('회원가입이 완료되었습니다! 로그인해주세요.', 'success');
        
        e.target.reset();
      } catch (error) {
        console.error('Signup error:', error);
      } finally {
        Utils.toggleLoading(submitBtn, false);
      }
    });

    // 아이디 유효성 검사
    function validateUsername(username) {
      const regex = /^[a-z0-9_-]{5,20}$/;
      return regex.test(username);
    }

    // 비밀번호 유효성 검사
    function validatePassword(password) {
      if (password.length < 8 || password.length > 16) return false;
      
      // 영문 대/소문자, 숫자, 특수문자 포함 확인
      const hasUpper = /[A-Z]/.test(password);
      const hasLower = /[a-z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const hasSpecial = /[!"#$%&'()*+,\-./:;?@\[\\\]^_`{|}~]/.test(password);
      
      // 허용되지 않은 문자 확인
      const validChars = /^[A-Za-z0-9!"#$%&'()*+,\-./:;?@\[\\\]^_`{|}~]+$/;
      if (!validChars.test(password)) return false;
      
      return (hasUpper || hasLower) && hasNumber && hasSpecial;
    }

    // 모달 닫기
    document.querySelectorAll('.modal-close, .btn-secondary[data-modal]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const modalId = e.target.dataset.modal || e.target.closest('.modal-content').parentElement.id;
        Utils.modal.hide(modalId);
      });
    });

    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          Utils.modal.hide(modal.id);
        }
      });
    });
  </script>
</body>
</html>
