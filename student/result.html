<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결과 확인 - Quiz Platform</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/file-upload.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-inner container-fluid">
        <div class="header-logo">📚 Quiz Platform</div>
        <nav class="header-nav">
          <a href="/student/dashboard.html">대시보드</a>
        </nav>
        <div class="header-user">
          <span class="user-name" id="user-name">로딩중...</span>
        </div>
      </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="page-content">
      <div class="container" style="max-width: 800px;">
        <!-- 결과 요약 -->
        <div class="result-summary">
          <div class="result-icon" id="result-icon">🎉</div>
          <h1 class="result-title" id="result-title">축하합니다!</h1>
          <div class="result-score" id="result-score">0/0</div>
          <div class="result-percentage" id="result-percentage">0%</div>
          <div class="result-message" id="result-message">잘했어요!</div>
        </div>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-3 mb-lg">
          <div class="card">
            <div class="card-body" style="text-align: center;">
              <div style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--success-color);">✓</div>
              <div style="font-size: 1.5rem; font-weight: 700;" id="stat-correct">0</div>
              <div style="font-size: 0.875rem; color: var(--text-secondary);">정답</div>
            </div>
          </div>

          <div class="card">
            <div class="card-body" style="text-align: center;">
              <div style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--error-color);">✗</div>
              <div style="font-size: 1.5rem; font-weight: 700;" id="stat-wrong">0</div>
              <div style="font-size: 0.875rem; color: var(--text-secondary);">오답</div>
            </div>
          </div>

          <div class="card">
            <div class="card-body" style="text-align: center;">
              <div style="font-size: 2rem; margin-bottom: 0.5rem;">📊</div>
              <div style="font-size: 1.5rem; font-weight: 700;" id="stat-percentage">0%</div>
              <div style="font-size: 0.875rem; color: var(--text-secondary);">정답률</div>
            </div>
          </div>
        </div>

        <!-- 액션 버튼 -->
        <div class="card mb-lg">
          <div class="card-body" style="display: flex; gap: var(--spacing-md); justify-content: center;">
            <button class="btn btn-outline" id="back-btn">← 대시보드로</button>
            <button class="btn btn-primary" id="review-btn">📝 복습하기</button>
          </div>
        </div>

        <!-- 문제별 결과 -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">문제별 결과</h3>
          </div>
          <div class="card-body" id="questions-result-container">
            <div style="text-align: center; padding: 2rem;">
              <div class="spinner"></div>
              <p style="margin-top: 1rem; color: var(--text-secondary);">로딩 중...</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/student/result.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      
      if (!Auth.requireAuth('student')) {
        return;
      }

      // 결과 페이지 초기화
      if (window.QuizResult) {
        await QuizResult.init();
      }

      const user = Auth.getCurrentUser();
      document.getElementById('user-name').textContent = user.name;
    });
  </script>
</body>
</html>
