<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과목 관리 - Quiz Platform</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-inner container-fluid">
        <div class="header-logo">📚 Quiz Platform</div>
        <nav class="header-nav">
          <a href="/teacher/dashboard.html">대시보드</a>
          <a href="/teacher/subjects.html" class="active">과목 관리</a>
          <a href="/teacher/students.html">학생 관리</a>
        </nav>
        <div class="header-user">
          <span class="user-name" id="user-name">로딩중...</span>
          <button class="btn btn-sm btn-secondary" id="logout-btn">로그아웃</button>
        </div>
      </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="page-content">
      <div class="container">
        <div class="mb-lg" style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h1>과목 관리</h1>
            <p class="text-muted">과목을 생성하고 퀴즈를 관리하세요</p>
          </div>
          <button class="btn btn-primary" id="add-subject-btn">
            ➕ 새 과목 추가
          </button>
        </div>

        <!-- 과목 목록 -->
        <div id="subjects-grid" class="grid grid-cols-3">
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
            <div class="spinner"></div>
            <p style="margin-top: 1rem; color: var(--text-secondary);">로딩 중...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 과목 추가/수정 모달 -->
  <div id="subject-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="subject-modal-title">새 과목 추가</h2>
        <button class="modal-close" data-modal="subject-modal">&times;</button>
      </div>
      <form id="subject-form" class="modal-body">
        <input type="hidden" id="subject-id">
        
        <div class="form-group">
          <label for="subject-name" class="form-label">과목명 *</label>
          <input 
            type="text" 
            id="subject-name" 
            class="form-input" 
            placeholder="예: 영어, 수학, 과학"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label">아이콘 선택 *</label>
          <div class="emoji-grid">
            <button type="button" class="emoji-option" data-emoji="📚" data-color="#3B82F6">📚</button>
            <button type="button" class="emoji-option" data-emoji="🔢" data-color="#F59E0B">🔢</button>
            <button type="button" class="emoji-option" data-emoji="🔬" data-color="#10B981">🔬</button>
            <button type="button" class="emoji-option" data-emoji="🌍" data-color="#14B8A6">🌍</button>
            <button type="button" class="emoji-option" data-emoji="🎨" data-color="#EC4899">🎨</button>
            <button type="button" class="emoji-option" data-emoji="🎵" data-color="#8B5CF6">🎵</button>
            <button type="button" class="emoji-option" data-emoji="⚽" data-color="#EF4444">⚽</button>
            <button type="button" class="emoji-option" data-emoji="💻" data-color="#6366F1">💻</button>
            <button type="button" class="emoji-option" data-emoji="🇬🇧" data-color="#EF4444">🇬🇧</button>
            <button type="button" class="emoji-option" data-emoji="📖" data-color="#F97316">📖</button>
            <button type="button" class="emoji-option" data-emoji="✍️" data-color="#64748B">✍️</button>
            <button type="button" class="emoji-option" data-emoji="🧮" data-color="#F59E0B">🧮</button>
            <button type="button" class="emoji-option" data-emoji="🌱" data-color="#84CC16">🌱</button>
            <button type="button" class="emoji-option" data-emoji="🎭" data-color="#EC4899">🎭</button>
            <button type="button" class="emoji-option" data-emoji="🏃" data-color="#EF4444">🏃</button>
            <button type="button" class="emoji-option" data-emoji="📝" data-color="#06B6D4">📝</button>
            <button type="button" class="emoji-option" data-emoji="🗣️" data-color="#F97316">🗣️</button>
            <button type="button" class="emoji-option" data-emoji="👂" data-color="#14B8A6">👂</button>
            <button type="button" class="emoji-option" data-emoji="🤔" data-color="#8B5CF6">🤔</button>
            <button type="button" class="emoji-option" data-emoji="🌟" data-color="#F59E0B">🌟</button>
          </div>
          <input type="hidden" id="subject-icon" value="📚" required>
          <input type="hidden" id="subject-color" value="#3B82F6">
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal="subject-modal">
          취소
        </button>
        <button type="submit" form="subject-form" class="btn btn-primary" id="subject-submit-btn">
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 과목 삭제 확인 모달 -->
  <div id="delete-subject-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>과목 삭제</h2>
        <button class="modal-close" data-modal="delete-subject-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-warning">
          <strong>경고:</strong> 이 과목과 관련된 모든 퀴즈가 삭제됩니다. 이 작업은 되돌릴 수 없습니다.
        </div>
        <p>정말로 "<strong id="delete-subject-name"></strong>" 과목을 삭제하시겠습니까?</p>
        <input type="hidden" id="delete-subject-id">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal="delete-subject-modal">
          취소
        </button>
        <button type="button" class="btn btn-error" id="confirm-delete-btn">
          삭제
        </button>
      </div>
    </div>
  </div>

  <style>
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }

    .emoji-option {
      width: 100%;
      aspect-ratio: 1;
      border: 3px solid transparent;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: var(--transition);
      font-size: 2rem;
      background-color: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji-option:hover {
      transform: scale(1.1);
      background-color: var(--gray-200);
    }

    .emoji-option.selected {
      border-color: var(--primary-color);
      background-color: var(--primary-color-light);
      box-shadow: 0 0 0 2px var(--bg-primary);
    }

    .subject-card {
      background: linear-gradient(135deg, var(--subject-color) 0%, var(--subject-color-dark) 100%);
      color: white;
      padding: var(--spacing-xl);
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-md);
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .subject-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-xl);
    }

    .subject-card-icon {
      font-size: 3rem;
      margin-bottom: var(--spacing-md);
    }

    .subject-card-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
    }

    .subject-card-stats {
      display: flex;
      gap: var(--spacing-md);
      font-size: 0.875rem;
      opacity: 0.9;
      margin-bottom: var(--spacing-md);
    }

    .subject-card-actions {
      display: flex;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-md);
    }

    .subject-card-btn {
      flex: 1;
      padding: var(--spacing-sm) var(--spacing-md);
      background-color: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.875rem;
    }

    .subject-card-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    .subject-card-menu {
      position: absolute;
      top: var(--spacing-md);
      right: var(--spacing-md);
    }

    .subject-card-menu-btn {
      background-color: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1.25rem;
    }

    .subject-card-menu-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }
  </style>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/teacher/subjects.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      
      if (!Auth.requireAuth('teacher')) {
        return;
      }

      // 과목 관리 초기화
      if (window.SubjectsManager) {
        await SubjectsManager.init();
      }

      const user = Auth.getCurrentUser();
      document.getElementById('user-name').textContent = user.name;

      document.getElementById('logout-btn').addEventListener('click', () => {
        Auth.signOut();
      });

      // 모달 닫기
      document.querySelectorAll('.modal-close, .btn-secondary[data-modal]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const modalId = e.target.dataset.modal || e.target.closest('.modal-close').parentElement.parentElement.parentElement.id;
          Utils.modal.hide(modalId);
        });
      });

      document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            Utils.modal.hide(modal.id);
          }
        });
      });

      // 이모지 선택
      document.querySelectorAll('.emoji-option').forEach(btn => {
        btn.addEventListener('click', () => {
          // 모든 이모지 선택 해제
          document.querySelectorAll('.emoji-option').forEach(b => b.classList.remove('selected'));
          
          // 선택한 이모지 활성화
          btn.classList.add('selected');
          
          // hidden input에 값 설정
          document.getElementById('subject-icon').value = btn.dataset.emoji;
          document.getElementById('subject-color').value = btn.dataset.color;
        });
      });

      // 첫 번째 이모지 기본 선택
      const firstEmoji = document.querySelector('.emoji-option');
      if (firstEmoji) {
        firstEmoji.classList.add('selected');
      }
    });
  </script>
</body>
</html>
